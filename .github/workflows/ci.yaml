name: Grammar CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  GRAMMAR_NAME: zhs
  GRAMMAR_DIR: cmn/zhs

jobs:
  compile-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build ACE from fork
        run: |
          sudo apt-get update && sudo apt-get install -y libboost-regex-dev
          git clone --depth 1 https://github.com/haveamission/REPP.git /tmp/repp-src
          cd /tmp/repp-src
          ./configure
          make
          sudo make install
          sudo ldconfig
          git clone --depth 1 https://github.com/haveamission/ACE.git /tmp/ace-src
          cd /tmp/ace-src
          make DELPHIN_CFLAGS= DELPHIN_LIBS= ace
          sudo mkdir -p /opt/ace
          sudo cp ace /opt/ace/
          echo "/opt/ace" >> $GITHUB_PATH

      - name: Install pyDelphin
        run: pip install pydelphin

      - name: Verify tools
        run: |
          ace -V
          delphin --version

      - name: Compile grammar
        working-directory: ${{ env.GRAMMAR_DIR }}
        run: |
          echo "Compiling ${GRAMMAR_NAME}.dat..."
          ace -g ace/config.tdl -G ${GRAMMAR_NAME}.dat 2>&1 | tee compile.log
          if [ ! -f "${GRAMMAR_NAME}.dat" ]; then
            echo "::error::Compilation failed - no .dat file produced"
            cat compile.log
            exit 1
          fi
          echo "Compiled successfully:"
          ls -lh ${GRAMMAR_NAME}.dat

      - name: Run regression tests
        working-directory: ${{ env.GRAMMAR_DIR }}
        run: |
          mkdir -p tsdb/current
          FAILURES=0
          TOTAL=0

          while IFS= read -r SUITE; do
            [ -z "$SUITE" ] && continue
            TOTAL=$((TOTAL + 1))

            echo ""
            echo "=== Test suite: $SUITE ==="

            echo "Creating profile..."
            rm -rf tsdb/current/$SUITE
            if [ -f "tsdb/skeletons/$SUITE/relations" ]; then
              delphin mkprof -s tsdb/skeletons/$SUITE tsdb/current/$SUITE 2>&1
            else
              delphin mkprof -s tsdb/skeletons/$SUITE -r tsdb/skeletons/Relations tsdb/current/$SUITE 2>&1
            fi

            echo "Parsing with ACE..."
            delphin process -g ${GRAMMAR_NAME}.dat tsdb/current/$SUITE 2>&1

            echo "Comparing against gold..."
            DIFF=$(delphin compare tsdb/fools_gold/$SUITE tsdb/current/$SUITE 2>&1)
            echo "$DIFF"

            REGRESSIONS=$(echo "$DIFF" | grep -E '<[0-9]+,[0-9]+,[1-9]' || true)
            if [ -n "$REGRESSIONS" ]; then
              echo "::error::Regression in $SUITE - lost parses:"
              echo "$REGRESSIONS"
              FAILURES=$((FAILURES + 1))
            else
              echo "✓ $SUITE passed"
            fi
          done < utils/COMPARISON

          echo ""
          echo "=== Regression Test Summary ==="
          PASSED=$((TOTAL - FAILURES))
          echo "Passed: $PASSED/$TOTAL"

          if [ $FAILURES -gt 0 ]; then
            echo "::error::$FAILURES regression test(s) failed"
            exit 1
          fi

          echo "All regression tests passed"

      - name: Upload compiled grammar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.GRAMMAR_NAME }}-dat
          path: ${{ env.GRAMMAR_DIR }}/${{ env.GRAMMAR_NAME }}.dat
          retention-days: 7

      - name: Upload MaxEnt model
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: maxent-model
          path: ${{ env.GRAMMAR_DIR }}/zhong.mem
          if-no-files-found: error
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-test-results
          path: ${{ env.GRAMMAR_DIR }}/tsdb/current/
          retention-days: 30

  deploy:
    needs: compile-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - name: Download compiled grammar
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.GRAMMAR_NAME }}-dat

      - name: Download MaxEnt model
        uses: actions/download-artifact@v4
        with:
          name: maxent-model

      - name: Upload to Spaces
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
          DEST: s3://pandaist/grammar-engine/grammars
          ENDPOINT: https://nyc3.digitaloceanspaces.com
        run: |
          set -euo pipefail
          for f in ${{ env.GRAMMAR_NAME }}.dat zhong.mem; do
            test -f "$f" || { echo "::error::$f was not produced"; exit 1; }
            # Keep the previous file as <name>.bak, as the droplet deploy did.
            if aws s3 ls "$DEST/$f" --endpoint-url "$ENDPOINT" >/dev/null; then
              aws s3 cp "$DEST/$f" "$DEST/$f.bak" --acl private --endpoint-url "$ENDPOINT"
            fi
            aws s3 cp "$f" "$DEST/$f" --acl private --endpoint-url "$ENDPOINT"
          done

      - name: Rebuild the engine workers with the new grammar
        run: |
          curl -sS --fail-with-body -X POST \
            "https://api.github.com/repos/haveamission/GrammarEngine/dispatches" \
            -H "Authorization: Bearer ${{ secrets.REPO_ACCESS_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            -d '{"event_type": "grammar-updated"}'
